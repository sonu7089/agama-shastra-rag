<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agama Shastra Guru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Main Chat Area -->
        <main class="chat-interface">
            <header class="chat-header">
                <div class="header-content">
                    <div class="header-left">
                        <h1>Agama Shastra Guru</h1>
                    </div>

                    <div class="header-center">
                        <span class="warning-text">We are working on improving our responses</span>
                    </div>

                    <div class="header-right">
                        <button id="new-chat-btn" class="btn-primary">
                            <span>+</span> New Chat
                        </button>
                    </div>
                </div>
            </header>

            <div id="chat-container" class="chat-container">
                <!-- Welcome Message -->
                <div class="message assistant">
                    <div class="avatar">
                        <img src="../assets/guru_icon.svg" alt="Guru" width="36" height="36">
                    </div>
                    <div class="message-content">
                        <p>Namaste. I am Shastra Guru. I can help you explore the wisdom of the Agama Shastras. How may
                            I assist you today?</p>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="user-input" placeholder="Ask a question about rituals, architecture, or philosophy..."
                        rows="1"></textarea>
                    <button id="send-btn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">AI responses may vary. Please verify with original texts.</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
